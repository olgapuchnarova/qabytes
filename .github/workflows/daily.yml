name: Daily QABytes Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4 openai

      - name: Run generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_feed.py

      - name: Commit and push if feed updated
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add feed.json

          if git diff --staged --quiet; then
            echo "No feed changes"
          else
            git commit -m "Update QABytes feed"
            git push
          fi
