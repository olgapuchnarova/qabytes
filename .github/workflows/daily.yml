name: Build And Deploy Site

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run JavaScript tests
        run: node --test tests/feed_logic.test.js

      - name: Generate feed
        run: python generate_feed.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Persist generated feed state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json feed_data.js feed_state.json raw_candidates.json
          git diff --cached --quiet || git commit -m "Update generated feed [skip ci]"
          git push

      - name: Assemble Pages artifact
        run: |
          BUILD_VERSION="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          mkdir site
          cp index.html site/
          cp analytics.js site/
          cp feed_data.js site/
          cp feed_logic.js site/
          cp styles.css site/
          cp script.js site/
          cp feed.json site/
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" site/index.html site/script.js
          echo "qabytes.com" > site/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
