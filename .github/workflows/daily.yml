name: Daily QABytes Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install feedparser requests beautifulsoup4 openai
          fi

      - name: Run generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_feed.py

      - name: Sync, Commit and Push
        run: |
          # 1. Stage the changes (the new data/feed.json)
          git add .
          
          # 2. Stash them so the working directory is 'clean' for the pull
          # We use '|| true' in case there are actually no changes to stash
          git stash || true
          
          # 3. Pull the latest from the remote to avoid conflicts
          git pull --rebase origin main
          
          # 4. Bring the new feed changes back on top
          git stash pop || echo "No stashed changes to apply"
          
          # 5. Finalize the commit
          git add .
          git commit -m "Update feed: $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push origin main
