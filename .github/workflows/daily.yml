name: Daily QABytes Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # If you don't have a requirements.txt yet, 
          # you can use: pip install feedparser requests beautifulsoup4 openai
          pip install -r requirements.txt

      # FIX: Pull BEFORE running the generator script
      - name: Sync with remote
        run: git pull --rebase origin main

      - name: Run generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_feed.py

      - name: Commit updated feed
        run: |
          git add .
          # The "exit 0" or "echo" ensures the workflow doesn't fail if no new articles were found
          git commit -m "Update feed: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
