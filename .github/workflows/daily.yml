name: Daily QABytes Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4 openai

      - name: Run generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_feed.py

      - name: Sync, Commit and Push
        run: |
          # Forcefully stage everything created by the script
          git add -A
          
          # Temporarily stash them
          git stash || true
          
          # Force the pull to overwrite the local state
          git pull --rebase origin main -X ours
          
          # Bring your new feed back
          git stash pop || echo "No changes to apply"
          
          # Final commit and push
          git add -A
          git commit -m "Update feed: $(date)" || exit 0
          git push origin main
