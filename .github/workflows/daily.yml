name: Daily Feed Update

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4 openai

      - name: Run feed generator
        run: python generate_feed.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Debug feed
        run: |
          echo "Feed preview:"
          cat public/feed.json | head -n 20

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      
          git add public/feed.json public/raw_candidates.json
      
          git commit -m "Update feed $(date)" || echo "No changes"
          git push
