<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QABytes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="header-bar">
    <div class="brand-block">
      <h1>QABytes</h1>
      <p class="tagline">Fresh QA signals and practical reads for the day ahead.</p>
    </div>
    <button id="saved-header-toggle" type="button" aria-expanded="false" aria-label="Toggle saved articles">
      <span class="bookmark-icon" aria-hidden="true"></span>
      <span id="saved-header-count" hidden>0</span>
    </button>
  </div>
</header>

<section>
  <div id="saved-section" hidden aria-live="polite">
    <div id="saved-feed" hidden></div>
  </div>

  <div id="filters"></div>
  <div id="feed"></div>
</section>

<script src="script.js"></script>
</body>
</html>
