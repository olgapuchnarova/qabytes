<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QABytes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css?v=20260330-3">
</head>
<body>

<header>
  <div class="header-bar">
    <div class="brand-block">
      <h1>QABytes</h1>
      <p class="tagline">Fresh QA signals and practical reads for the day ahead.</p>
    </div>
    <button id="saved-header-toggle" type="button" aria-expanded="false" aria-label="Toggle saved articles">
      <svg class="bookmark-icon" viewBox="0 0 14 18" aria-hidden="true" focusable="false">
        <path d="M3 1.25h8a1.75 1.75 0 0 1 1.75 1.75v13.05l-5.75-3.43-5.75 3.43V3A1.75 1.75 0 0 1 3 1.25Z" fill="currentColor"></path>
      </svg>
      <span id="saved-header-count" hidden>0</span>
    </button>
  </div>
</header>

<section>
  <div id="saved-section" hidden aria-live="polite">
    <div id="saved-feed" hidden></div>
  </div>

  <div id="filters"></div>
  <div id="feed"></div>
</section>

<script src="feed_logic.js?v=20260330-3"></script>
<script src="script.js?v=20260330-3"></script>
</body>
</html>
